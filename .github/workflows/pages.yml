name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages has to be switched on once by hand: Settings -> Pages -> Source:
      # GitHub Actions. Creating a Pages site needs admin rights on the
      # repository, and a workflow's GITHUB_TOKEN never has those - so
      # configure-pages with enablement: true cannot do it either. Deploying to
      # an existing site only needs pages: write, which is granted above.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
