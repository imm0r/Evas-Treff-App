name: Tests

on:
  push:
    paths: ["app/**", "tools/**", "package.json", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The QR encoder is diffed against an independent implementation rather
      # than against its own output, so the reference has to be installed.
      - run: pip install qrcode

      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
